[versions]
compileSdk = "37"
minSdk = "24"
targetSdk = "37"
agp = "9.4.1"
# Single source for KGP, the compiler and the Compose/serialization plugins (and build-logic's KGP).
# 2.3.21 is the latest 2.3 patch: it matches the Kotlin embedded in Gradle 9.6 (kotlin-dsl in
# build-logic) and clears Koog's 2.3.10 floor. 2.4.x waits for a Gradle whose embedded Kotlin can read it.
kotlin = "2.3.21"
coreKtx = "1.19.0"
activityCompose = "1.11.0"
composeBom = "2025.09.00"
junit = "4.13.2"
konsist = "0.17.3"
detekt = "2.0.0-alpha.6"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
molecule = "2.2.0"
turbine = "1.2.1"
kotlinxCoroutines = "1.10.2"
# Koin 4.2 pulls Compose 1.10; held with the Compose BOM (2025.09.00), not for the stdlib.
koin = "4.1.1"
# Data stack (catalog-repository-cache). kotlin-stdlib follows the compiler (2.3.21); OkHttp 5.5.0
# needs stdlib 2.2.21 and kotlinx-serialization 1.11.0 needs 2.3.20, so neither is held back any more.
# KSP 2.3.x is the first line that works with AGP 9 built-in Kotlin and is decoupled from the Kotlin
# version (2.3.12 is the latest).
ksp = "2.3.12"
room = "2.8.4"
okhttp = "5.5.0"
kotlinxSerialization = "1.11.0"
desugarJdkLibs = "2.1.5"
sqlite = "2.6.2"
# Navigation (song-detail-screen, N1). 2.9.8 is the last 2.9.x. 2.10.x raises Compose to 1.10 and
# activity-compose to 1.13 over the pinned BOM (2025.09.00, Compose 1.9). Upgrade with the BOM.
navigationCompose = "2.9.8"
# DataStore Preferences (admin-passphrase-login, A2): the verified admin passphrase. 1.2.1 asks for
# versions at or below what the build resolves; nothing urgent holds it, upgrade when convenient.
datastore = "1.2.1"
# Koog agent (assistant-agent-core, D-21/D-23). 1.3.0 needs Kotlin >= 2.3.10 and ships Java 17 bytecode.
# Only agents-core + http-client-ktor, never the koog-agents umbrella (it pulls Anthropic, AWS, Ollama...).
# Ktor 3.3.3 is the version Koog 1.3.0 is built against; the OkHttp engine reuses the project's OkHttp.
koog = "1.3.0"
ktor = "3.3.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
molecule-runtime = { group = "app.cash.molecule", name = "molecule-runtime", version.ref = "molecule" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-test = { group = "io.insert-koin", name = "koin-test" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
sqlite-bundled-jvm = { group = "androidx.sqlite", name = "sqlite-bundled-jvm", version.ref = "sqlite" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
koog-agents-core = { group = "ai.koog", name = "agents-core", version.ref = "koog" }
koog-http-client-ktor = { group = "ai.koog", name = "http-client-ktor", version.ref = "koog" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
# For build-logic only: the convention plugins compile against AGP and KGP (compileOnly).
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
